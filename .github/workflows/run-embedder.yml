name: Run Embedder

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    paths:
      - "backend/data/resume.yaml"
      - "backend/data/projects.yaml"

jobs:
  embed:
    name: Rebuild image and re-embed data on EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH to EC2 and run embedder
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 3.24.107.104
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd myResume
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend python rag/embedder.py
