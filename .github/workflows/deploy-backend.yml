name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 3.24.107.104
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd myResume
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
