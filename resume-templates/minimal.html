<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Minimal</title>
<style>
  @page { size: A4; margin: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #d1d5db; }

  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 18mm 22mm 14mm;
    background: #fff;
    margin: 0 auto;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 9pt;
    color: #222;
    line-height: 1.5;
  }

  @media print {
    html, body { background: white; }
    .page { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* Header */
  .resume-name {
    font-size: 21pt;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4pt;
    color: #111;
  }
  .resume-contact {
    font-size: 8pt;
    color: #666;
    letter-spacing: 0.5px;
    margin-bottom: 3pt;
  }
  .resume-links {
    font-size: 8pt;
    color: #666;
    margin-bottom: 14pt;
  }
  .resume-links a { color: #444; text-decoration: none; }
  .header-rule { border: none; border-top: 0.75pt solid #ccc; margin-bottom: 14pt; }

  /* Section */
  .section { margin-bottom: 12pt; }
  .section-title {
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #999;
    margin-bottom: 7pt;
  }

  /* Summary */
  .summary p {
    margin-bottom: 4pt;
    color: #333;
    font-size: 9pt;
  }

  /* Skills — two column minimal */
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18pt; }
  .skill-group { margin-bottom: 6pt; }
  .skill-group-name {
    font-size: 8pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
    margin-bottom: 2pt;
  }
  .skill-group ul { padding-left: 0; list-style: none; }
  .skill-group li { font-size: 8.5pt; color: #444; padding: 0.5pt 0; }

  /* Entry */
  .entry { margin-bottom: 9pt; page-break-inside: avoid; }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5pt;
  }
  .entry-company { font-weight: 600; font-size: 9.5pt; color: #111; }
  .entry-date { font-size: 8pt; color: #999; }
  .entry-role { font-size: 8.5pt; color: #666; margin-bottom: 3pt; }
  .entry-url { font-size: 7.5pt; color: #888; margin-bottom: 3pt; }
  .entry-url a { color: #666; }
  .entry ul { padding-left: 10pt; margin: 2pt 0; }
  .entry li { margin-bottom: 1.5pt; color: #333; font-size: 8.5pt; }
  .entry-achievements-title {
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #999;
    margin: 4pt 0 2pt;
  }
  .entry-impact-title {
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #999;
    margin: 4pt 0 2pt;
  }
  .entry-tech { font-size: 8pt; color: #888; margin-top: 3pt; font-style: italic; }
  .rule { border: none; border-top: 0.5pt solid #e5e5e5; margin: 10pt 0; }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
