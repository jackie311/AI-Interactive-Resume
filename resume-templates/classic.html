<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Classic</title>
<style>
  @page { size: A4; margin: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #f0f0f0; }

  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 14mm 18mm 12mm;
    background: #fff;
    margin: 0 auto;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 9.5pt;
    color: #111;
    line-height: 1.45;
  }

  @media print {
    html, body { background: white; }
    .page { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* Header */
  .resume-name {
    font-size: 22pt;
    font-weight: bold;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 4pt;
  }
  .resume-contact {
    text-align: center;
    font-size: 8.5pt;
    color: #333;
    margin-bottom: 3pt;
  }
  .resume-links {
    text-align: center;
    font-size: 8.5pt;
    color: #333;
    margin-bottom: 10pt;
  }
  .resume-links a { color: #333; text-decoration: none; }

  /* Section */
  .section { margin-bottom: 9pt; }
  .section-title {
    font-size: 10pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    border-bottom: 1pt solid #111;
    padding-bottom: 2pt;
    margin-bottom: 6pt;
  }

  /* Summary */
  .summary p { margin-bottom: 4pt; }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16pt; }
  .skill-group { margin-bottom: 5pt; }
  .skill-group-name { font-weight: bold; font-size: 9.5pt; margin-bottom: 2pt; }
  .skill-group ul { padding-left: 14pt; }
  .skill-group li { margin-bottom: 1pt; font-size: 9pt; }

  /* Work / Project entries */
  .entry { margin-bottom: 8pt; }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1pt;
  }
  .entry-company { font-weight: bold; font-size: 10pt; }
  .entry-date { font-size: 8.5pt; color: #444; font-style: italic; }
  .entry-role { font-style: italic; font-size: 9pt; color: #333; margin-bottom: 3pt; }
  .entry-location { font-size: 8.5pt; color: #555; }
  .entry ul { padding-left: 14pt; margin-bottom: 3pt; }
  .entry li { margin-bottom: 1.5pt; }
  .entry-achievements { margin-top: 3pt; }
  .entry-achievements-title { font-weight: bold; font-size: 9pt; margin-bottom: 2pt; }
  .entry-tech { font-style: italic; font-size: 8.5pt; color: #444; margin-top: 3pt; }
  .entry-url { font-size: 8pt; color: #555; margin-bottom: 3pt; }
  .entry-url a { color: #555; }

  /* Impact */
  .entry-impact-title { font-weight: bold; font-size: 9pt; margin-top: 3pt; margin-bottom: 2pt; }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
