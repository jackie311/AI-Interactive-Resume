<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Modern</title>
<style>
  @page { size: A4; margin: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #e5e7eb; }

  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 12mm 16mm 12mm;
    background: #fff;
    margin: 0 auto;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    font-size: 9.5pt;
    color: #1f2937;
    line-height: 1.5;
  }

  @media print {
    html, body { background: white; }
    .page { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* Header */
  .resume-header { margin-bottom: 10pt; border-bottom: 2.5pt solid #2563eb; padding-bottom: 8pt; }
  .resume-name {
    font-size: 24pt;
    font-weight: 700;
    color: #2563eb;
    letter-spacing: -0.5px;
    margin-bottom: 3pt;
  }
  .resume-contact {
    font-size: 8.5pt;
    color: #6b7280;
    display: flex;
    flex-wrap: wrap;
    gap: 0 12pt;
  }
  .resume-contact a { color: #2563eb; text-decoration: none; }

  /* Section */
  .section { margin-bottom: 9pt; }
  .section-title {
    font-size: 9.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #2563eb;
    border-bottom: 1.5pt solid #dbeafe;
    padding-bottom: 2.5pt;
    margin-bottom: 7pt;
  }

  /* Summary */
  .summary p { margin-bottom: 4pt; color: #374151; }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14pt; }
  .skill-group { margin-bottom: 5pt; }
  .skill-group-name {
    font-weight: 600;
    font-size: 9pt;
    color: #374151;
    margin-bottom: 2pt;
  }
  .skill-group ul { padding-left: 0; list-style: none; }
  .skill-group li {
    font-size: 8.5pt;
    color: #4b5563;
    padding: 1pt 0;
  }
  .skill-group li::before { content: "· "; color: #2563eb; font-weight: bold; }

  /* Work / Project entries */
  .entry { margin-bottom: 8pt; page-break-inside: avoid; }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1pt;
  }
  .entry-left { flex: 1; }
  .entry-company { font-weight: 700; font-size: 10.5pt; color: #111827; }
  .entry-role { font-size: 9pt; color: #6b7280; font-style: italic; }
  .entry-date-loc { text-align: right; }
  .entry-date { font-size: 8.5pt; color: #6b7280; display: block; }
  .entry-location { font-size: 8pt; color: #9ca3af; display: block; }
  .entry ul { padding-left: 12pt; margin: 4pt 0 3pt; }
  .entry li { margin-bottom: 2pt; color: #374151; }
  .entry-achievements-title { font-weight: 600; font-size: 9pt; color: #1f2937; margin: 4pt 0 2pt; }
  .entry-impact-title { font-weight: 600; font-size: 9pt; color: #1f2937; margin: 4pt 0 2pt; }
  .entry-url { font-size: 8pt; margin-bottom: 3pt; }
  .entry-url a { color: #2563eb; text-decoration: none; }
  .entry-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 3pt;
    margin-top: 4pt;
  }
  .tag {
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 7.5pt;
    padding: 1pt 5pt;
    border-radius: 3pt;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="page">
{{BODY}}
</div>
</body>
</html>
